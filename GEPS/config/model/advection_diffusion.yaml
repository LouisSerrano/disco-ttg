  dataset_name: advection-diffusion
  num_env: 200
  hidden_c: 64
  state_c: 1
  code_c: 2
  method: 'rk4'
  factor: 1
  is_complete: False
  type_augment: 
  options:
  teacher_forcing_init: 0.99
  teacher_forcing_decay: 0.99
  teacher_forcing_update: 10
  default_integration_time: 0.1
  init_type:
    A:
      type: orthogonal
      gain: 1
    B:
      type: orthogonal
      gain: 1
    weight:
      type: orthogonal
      gain: 1

