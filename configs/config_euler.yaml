training:
  project: "disco-ttg"
  max_steps: 10000
  batch_size: 64
  lr: 3e-4
  weight_decay: 1e-6
  in_context: False  # When True: use target_output (different trajectory), When False: use output (same trajectory)
  in_context_progressive: False  # When True: gradually increase in-context probability from ~0 to ~1 during training
  warmup_steps: 100
  min_lr_ratio: 1e-3
  noise_level: 0
  num_workers: 4
  prefetch_factor: 2
  # New parameters for checkpoint loading and progressive steps
  checkpoint_path: null  # Path to checkpoint file for resuming training
  progressive_steps: False  # Enable progressive step refinement
  step_schedule: [1, 2, 5]  # Steps schedule for progressive training
  step_percentages: [0.9, 0.05, 0.05]  # Percentage of training for each step
  curriculum_enabled: False
  curriculum_start_frames: 1  # Start curriculum with 1 output frame
  curriculum_end_frames: 16  # End curriculum with 16 output frames
  curriculum_warmup_steps: 5000  # Number of steps for curriculum warmup (default: 50% of max_steps)
  num_environments: 17  # Will be overwritten by dataset (1 Euler + m viscosities)
  codebook_prob: 0.0  # Probability of using codebook lookup (0.0 = never use codebook, 1.0 = always use)
  # Overfit test mode: use only Euler (label 0) with limited trajectories to verify model can memorize
  overfit_test: False  # Enable overfit test mode
  overfit_ntrain: 1  # Number of training trajectories in overfit mode

data:
  dataset_name: "euler"
  # Data file configuration - path to directory with trajectories_gpu*.h5 files
  file_dir: "${oc.env:DISCO_NS_DATA,datasets/euler_ns_short}/"
  num_gpus: 8  # Number of GPU files to load
  output_dir: "${oc.env:DISCO_OUTPUTS,outputs}/"
  sub_x: 1
  sub_t: 1
  n_input_frames: 16
  n_output_frames: 2
  vorticity_scale: 10.0  # Scale factor to divide vorticity by
  filter_labels: null  # Optional list of labels to include (e.g. [0] for Euler only, [0, 1] for Euler + 1st viscosity)
  T_limit: null 

model:
  n_states: 1  # Single channel (vorticity)
  hidden_dim: 128
  theta_dim: 2  # Captures viscosity parameter (0 for Euler, varying for diffusion)
  patch_size: 16
  ndims: [2]
  groups: 1
  processor_blocks: 4
  drop_path: 0.
  num_heads: 4
  bias_type: "rel"
  hpnn_head_hidden_dim: 128
  max_steps: 1
  atol: 1e-6
  rtol: 1e-5
  use_adjoint: False
  solver: rk4
  decoder_use_bias: True
  principled_initialization: True
  boundary_conditions: periodic  # Options: null, "periodic", "reflect", "replicate", "zeros"
  opnn_channels: 8  # Base number of channels for OperatorNetwork (controls parameter count)
  opnn_bottleneck_multiplier: 2  # Multiplier for bottleneck layer channels (default: 16*channels -> 32*channels)
  default_integration_time: 1  # Default total integration time

test:
  dataset_name: "euler"
  results_dir: "${oc.env:DISCO_RESULTS,results}/"
  splits: ["train", "val", "test"]
  num_steps: 1
