training:
  project: "disco-ball-operator"
  max_steps: 100000
  batch_size: 64 #64 before
  lr: 1e-4
  weight_decay: 1e-4
  in_context: True
  warmup_steps: 1000 
  min_lr_ratio: 1e-3

data:
  dataset_name: "advection-diffusion"
  setting: "scarce"
  train_path: "/mnt/home/lserrano/disco-ball/datasets/train_${data.setting}.npz"
  val_path: "/mnt/home/lserrano/disco-ball/datasets/val_${data.setting}.npz"
  test_path: "/mnt/home/lserrano/disco-ball/datasets/test_${data.setting}.npz"
  output_dir: "/mnt/home/lserrano/disco-ball/outputs/"
  sub_x: 1
  sub_t: 1
  n_input_frames: 16
  n_output_frames: 2
  # Dataset generation parameters
  L: 16.0
  nx: 256
  nt: 100
  T: 10.0
  fractal_power_range: [1.0, 5.0] #8
  fractal_degree: 256
  v_range: [0.01, 1.0]
  D_range: [0.001, 1.0]

model:
  patch_size: 8
  num_heads: 4

  n_states: 1
  hidden_dim: 128
  theta_dim: 2
  ndims: [1]
  groups: 1 
  processor_blocks: 4
  drop_path: 0.
  bias_type: "rel"
  hpnn_head_hidden_dim: 128
  max_steps: 1
  atol: 1e-6
  rtol: 1e-5 
  use_adjoint: False
  solver: euler
  decoder_use_bias: True
  principled_initialization: True
  use_standardization: False 

test:
  #ckpt_time: "2025-06-15/23-50-46"
  run_name: 
  ckpt_time: "2025-06-15/23-50-46"
  ckpt_path: "outputs/${test.ckpt_time}/model_final.ckpt"
  #ckpt_path: "outputs/2025-06-15/23-46-48/model_final.ckpt"
  dataset_name: "advection_diffusion"
  data_dir: "datasets"
  setting: "dense"  # or "scarce"
  n_input: 16
  n_pred: 50
  results_dir: "/mnt/home/lserrano/disco-ball/results/"
  splits: ["train", "val", "test"]
