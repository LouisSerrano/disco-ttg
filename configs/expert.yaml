training:
  project: "disco-ttg"
  max_steps: 100000
  batch_size: 256 #64 before
  lr: 3e-4
  weight_decay: 1e-4
  sparsity_alpha: 0.01
  in_context: True

data:
  dataset_name: "advection-diffusion"
  setting: "scarce"
  train_path: "/mnt/home/lserrano/disco-ttg/datasets/train_${data.setting}.npz"
  val_path: "/mnt/home/lserrano/disco-ttg/datasets/val_${data.setting}.npz"
  test_path: "/mnt/home/lserrano/disco-ttg/datasets/test_${data.setting}.npz"
  sub_x: 1
  sub_t: 1
  n_input_frames: 16
  n_output_frames: 3
  output_dir: "/mnt/home/lserrano/disco-ttg/outputs/"
  # Dataset generation parameters
  L: 16.0
  nx: 256
  nt: 100
  T: 10.0
  fractal_power_range: [1.0, 8.0]
  fractal_degree: 256
  v_range: [0.01, 1.0]
  D_range: [0.001, 1.0]

model:
  n_states: 1
  hidden_dim: 128
  n_experts: 2
  patch_size: 8
  ndims: [1]
  groups: 1 
  processor_blocks: 4
  drop_path: 0.
  num_heads: 4
  bias_type: "rel"
  max_steps: 10
  atol: 1e-6
  rtol: 1e-5 
  use_adjoint: False
  gating_log_scale: False

test:
  #ckpt_time: "2025-06-15/23-50-46"
  ckpt_time: "2025-06-15/23-50-46"
  ckpt_path: "outputs/${test.ckpt_time}/model_final.ckpt"
  #ckpt_path: "outputs/2025-06-15/23-46-48/model_final.ckpt"
  dataset_name: "advection_diffusion"
  data_dir: "datasets"
  setting: "dense"  # or "scarce"
  n_input: 16
  n_pred: 50
  results_dir: "results/${test.ckpt_time}/"
  splits: ["train", "val", "test"]
