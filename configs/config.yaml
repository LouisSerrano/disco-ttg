training:
  project: "neural-operator-splitting"
  max_steps: 100000
  batch_size: 64 #64 before
  lr: 5e-4
  weight_decay: 1e-4
  in_context: True
  warmup_steps: 1000 
  min_lr_ratio: 1e-3
  noise_level: 0 #0.001
  mixed_physics: False  # When True: training samples can have both v!=0 and D!=0
  mixed_physics_ratio: 0.0  # Fraction of training samples that are mixed (rest split 50/50 pure adv/diff)

data:
  dataset_name: "advection-diffusion"
  setting: "scarce"
  train_path: "${oc.env:DISCO_DATA,datasets}/train_${data.setting}.npz"
  val_path: "${oc.env:DISCO_DATA,datasets}/val_${data.setting}.npz"
  test_path: "${oc.env:DISCO_DATA,datasets}/test_${data.setting}.npz"
  output_dir: "${oc.env:DISCO_OUTPUTS,outputs}/"
  sub_x: 1
  sub_t: 1
  n_input_frames: 16
  n_output_frames: 2
  # Dataset generation parameters
  L: 16.0
  nx: 256
  nt: 100
  T: 10.0
  fractal_power_range: [1.0, 4.0] #[1.0, 4.0] #[1.0, 8.0] #8
  fractal_degree: 256
  v_range: [0.01, 1.0]
  D_range: [0.001, 1.0]

model:
  n_states: 1
  hidden_dim: 128
  theta_dim: 2
  patch_size: 16 #8
  ndims: [1]
  groups: 1 
  processor_blocks: 4
  drop_path: 0.
  num_heads: 4
  bias_type: "rel"
  hpnn_head_hidden_dim: 128
  max_steps: 1
  atol: 1e-6
  rtol: 1e-5 
  use_adjoint: False
  solver: rk4
  decoder_use_bias: True
  principled_initialization: False
  boundary_conditions: periodic  # Options: null, "periodic", "reflect", "replicate", "zeros"
  opnn_channels: 8  # Base number of channels for OperatorNetwork (controls parameter count)
  opnn_bottleneck_multiplier: 2  # Multiplier for bottleneck layer channels (default: 16*channels -> 32*channels)
  default_integration_time: 0.1  # Default total integration time

test:
  #ckpt_time: "2025-06-15/23-50-46"
  run_name: 
  ckpt_time: "2025-06-15/23-50-46"
  ckpt_path: "outputs/${test.ckpt_time}/model_final.ckpt"
  #ckpt_path: "outputs/2025-06-15/23-46-48/model_final.ckpt"
  dataset_name: "advection_diffusion"
  data_dir: "datasets"
  setting: "dense"  # or "scarce"
  n_input: 16
  n_pred: 50
  results_dir: "${oc.env:DISCO_RESULTS,results}/"
  splits: ["train", "val", "test"]
  num_steps: 1
