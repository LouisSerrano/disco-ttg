# VQVAE2D Tokenizer Configuration for Euler/Navier-Stokes

data:
  dataset_name: "euler-ns"
  # Euler/NS data configuration
  file_dir: "./datasets/euler_ns_short"  # Directory with trajectories_gpu*.h5 files
  num_gpus: 8   # Number of GPU shards
  output_dir: "./outputs/zebra/tokenizer/"
  n_input_frames: 1
  n_output_frames: 1
  sub_x: 1
  sub_t: 1
  vorticity_scale: 10.0  # Normalization factor for vorticity
  image_size: 256
  channels: 1
  saved_folder:
  resume_training: False
  checkpoint_path:

model:
  channels: 1  # 1 channel for vorticity (vs 2 for Gray-Scott)
  init_dim: 64
  max_dim: 512
  layers:
    - "residual"
    - "compress_space"
    - "residual"
    - "compress_space"
    - "residual"
    - "compress_space"
    - "residual"
    - "compress_space"
  code_dim: 64
  num_codebooks: 2
  codebook_size: 1024  #1024
  num_groups: 16
  pad_mode: "circular"
  quantization_type: "resvq"
  shared_codebook: true
  input_conv_kernel_size: 5
  residual_conv_kernel_size: 3

training:
  commitment_weight: 0.25
  learning_rate: 1e-4
  weight_decay: 1e-4
  batch_size: 16 
  max_steps: 300000
  warmup_steps: 1000
  seed: 42
  num_workers: 4
  accelerator: "auto"
  devices: 1
  strategy: "auto"
  precision: "32"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  smoothing: false

logging:
  project: "zebra"
  entity: null
  tags: ["vq", "2d", "euler-ns"]
  save_every_n_steps: 5000
  checkpoint_every_n_steps: 5000
  output_dir: "~/zebra/outputs"

huggingface:
  push_to_hub: false
  repo_name: "zebra-vqvae2d-euler-ns"
  private: true
  commit_message: "Add VQVAE2D tokenizer for Euler/NS"
  model_card: "tokenizer_model_card.md"
  model_card_template: "tokenizer_model_card.md"
