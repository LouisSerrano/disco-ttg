# VQVAE1D Tokenizer Configuration


data:
  data_dir: "/mnt/home/lserrano/data/"
  output_dir: "/mnt/home/lserrano/ceph/zebra/tokenizer/"
  dataset_name: "advection-diffusion"
  slice_size: 1
  setting: "scarce"
  train_path: "/mnt/home/lserrano/disco-ttg/datasets/train_${data.setting}.npz"
  val_path: "/mnt/home/lserrano/disco-ttg/datasets/val_${data.setting}.npz"
  test_path: "/mnt/home/lserrano/disco-ttg/datasets/test_${data.setting}.npz"
  sub_x: 1
  sub_t: 1
  n_input_frames: 1
  n_output_frames: 1
  # Dataset generation parameters
  L: 16.0
  nx: 256
  nt: 100
  T: 10.0
  fractal_power_range: [1.0, 4.0] #[1.0, 4.0] #[1.0, 8.0] #8
  fractal_degree: 256
  v_range: [0.01, 1.0]
  D_range: [0.001, 1.0]
  train_hdf5_files:
    - "/mnt/home/lserrano/disco-ttg/datasets/combined_equation/E_EULER_train_envsize64.h5"
    - "/mnt/home/lserrano/disco-ttg/datasets/combined_equation/E_HEAT_train_envsize64.h5"
    - "/mnt/home/lserrano/disco-ttg/datasets/combined_equation/E_DISP_train_envsize64.h5"
  val_hdf5_files:
    - "/mnt/home/lserrano/disco-ttg/datasets/combined_equation/E_EULER_valid.h5"
    - "/mnt/home/lserrano/disco-ttg/datasets/combined_equation/E_HEAT_valid.h5"
    - "/mnt/home/lserrano/disco-ttg/datasets/combined_equation/E_DISP_valid.h5"
  test_hdf5_files:
    - "/mnt/home/lserrano/disco-ttg/datasets/combined_equation/E_EULER_test.h5"
    - "/mnt/home/lserrano/disco-ttg/datasets/combined_equation/E_HEAT_test.h5"
    - "/mnt/home/lserrano/disco-ttg/datasets/combined_equation/E_DISP_test.h5"

model:
  channels: 1
  init_dim: 64
  max_dim: 256
  layers:
    - "residual"
    - "compress_space"
    - "compress_space"
    - "compress_space"
    - "compress_space"
    - "residual"
  code_dim: 64
  num_codebooks: 2
  codebook_size: 256
  num_groups: 8
  pad_mode: "circular"
  quantization_type: "resvq"
  shared_codebook: true
  input_conv_kernel_size: 5
  residual_conv_kernel_size: 3

training:
  commitment_weight: 0.25
  learning_rate: 1e-4
  weight_decay: 1e-4
  batch_size: 64
  max_steps: 300000
  warmup_steps: 1000
  seed: 42
  num_workers: 4
  accelerator: "auto"
  devices: 1
  strategy: "auto"
  precision: "32"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1

logging:
  project: "zebra"
  entity: null  # Set this to your wandb username
  tags: ["vq", "1d"]
  save_every_n_steps: 5000
  checkpoint_every_n_steps: 5000 
  output_dir: "~/zebra/outputs"

huggingface:
  push_to_hub: false
  repo_name: "zebra-vqvae1d"
  private: true
  commit_message: "Add VQVAE1D tokenizer"
  model_card: "tokenizer_model_card.md"
  model_card_template: "tokenizer_model_card.md"
